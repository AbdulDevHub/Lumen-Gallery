name: Release extension zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package extension
        run: |
          node tools/package.mjs
          cd dist/extension && zip -r ../../lumen-gallery-extension.zip . -x '.*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lumen-gallery-extension.zip \
            --title "Lumen Gallery $GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md
